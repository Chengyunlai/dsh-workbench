name: Integration
on:
  pull_request:
    paths:
      - '.github/workflows/integration.yml'
      - 'scripts/setup-ci-tools.mjs'
      - 'test/*.e2e.mjs'
      - 'test/support/**'
      - 'debug*.js'
      - 'language*.js'
  schedule:
    - cron: '20 19 * * 0'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  interoperability:
    name: Real language servers and debuggers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.5'
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - run: npm ci
      - run: npm run setup:ci-tools
      - run: npm run test:languages
      - run: npm run test:debug
